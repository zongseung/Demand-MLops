worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==============================
    # Logging
    # ==============================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ==============================
    # Performance
    # ==============================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ==============================
    # Security - Hide version
    # ==============================
    server_tokens off;

    # ==============================
    # Rate Limiting (Brute-force 방지)
    # ==============================
    # 일반 요청: IP당 100req/sec (대시보드 로딩에 많은 요청 필요)
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

    # ==============================
    # Upstream
    # ==============================
    upstream grafana_backend {
        server grafana:3000;
        keepalive 32;
    }

    # ==============================
    # Server Block
    # ==============================
    server {
        listen 80;
        server_name _;

        # Request size limit (대시보드 JSON 업로드 방지)
        client_max_body_size 1m;

        # ==============================
        # Security Headers
        # ==============================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # CSP: 지도 타일 등 외부 리소스 허용
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src 'self'; connect-src * ws: wss:; frame-ancestors 'self';" always;

        # ==============================
        # Basic Auth
        # ==============================
        auth_basic "Grafana Dashboard";
        auth_basic_user_file /etc/nginx/htpasswd;


        # ==============================
        # Block dangerous endpoints
        # ==============================
        # Grafana API 수정 endpoints 차단
        location ~ ^/api/(dashboards|datasources|folders|alert-notifications|annotations|org|admin|users) {
            # GET은 허용, POST/PUT/DELETE/PATCH 차단
            limit_except GET {
                deny all;
            }

            proxy_pass http://grafana_backend;
            include /etc/nginx/proxy_params;
        }

        # Grafana Admin 페이지 차단
        location ~ ^/(admin|api/admin) {
            deny all;
            return 403;
        }

        # ==============================
        # Main Proxy
        # ==============================
        location / {
            limit_req zone=general_limit burst=50 nodelay;

            proxy_pass http://grafana_backend;
            include /etc/nginx/proxy_params;
        }

        # ==============================
        # Health check (인증 없이)
        # ==============================
        location /api/health {
            auth_basic off;
            proxy_pass http://grafana_backend;
            include /etc/nginx/proxy_params;
        }

        # ==============================
        # WebSocket - Grafana Live (비활성화)
        # Safari 등에서 WS 인증 문제 방지
        # ==============================
        location /api/live/ws {
            return 204;
        }

        # ==============================
        # Error pages
        # ==============================
        error_page 401 /401.html;
        location = /401.html {
            auth_basic off;
            internal;
            return 401 '{"error": "Authentication required"}';
            add_header Content-Type application/json;
        }

        error_page 403 /403.html;
        location = /403.html {
            auth_basic off;
            internal;
            return 403 '{"error": "Access denied"}';
            add_header Content-Type application/json;
        }
    }

    # ==============================
    # Admin Port (Grafana UI 로그인용)
    # ==============================
    server {
        listen 3010;
        server_name _;

        # Basic Auth (관리자 전용 포트)
        auth_basic "Grafana Admin";
        auth_basic_user_file /etc/nginx/htpasswd;

        # 동일 보안 헤더
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; font-src 'self'; connect-src * ws: wss:; frame-ancestors 'self';" always;

        # Admin 포트에서는 Auth Proxy 헤더를 전달하지 않음
        location / {
            proxy_pass http://grafana_backend;
            include /etc/nginx/proxy_params_admin;
        }
    }
}
